project:
  type: website
  output-dir: _site
  resources:
    - files/
  render:
    - "*.qmd"
    - "!research/"   # hidden until the page is filled in; remove this line to publish it

website:
  title: "Dmitriy Zhigunov"
  site-url: "https://dzhigunov.github.io"
  description: "Academic website of Dmitriy Zhigunov: fluid dynamics, turbulence, publications and talks."
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Publications"
        href: publications/index.qmd
      
    right:
      - icon: github
        href: https://github.com/dzhigunov
        aria-label: GitHub
  page-footer:
    center: "© Dmitriy Zhigunov · Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [flatly, styles.scss]
      dark: [darkly, styles.scss]
    toc: false
    html-math-method: katex
    smooth-scroll: true

execute:
  freeze: auto   # computed pages are re-run only when their source changes
